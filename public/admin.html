<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Paneli administrativ — CIPI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css?v=admin-2"><script defer src="/admin.js?v=admin-3"></script></head><body class="admin-body"><div class="admin-layout"><aside class="sidebar" id="sidebar"><a class="brand brand-light" href="/"><span class="brand-mark">C</span><span>CIPI<span class="brand-sub">RENT A CAR</span></span></a><p class="side-label">MENYJA</p><button class="side-link active" data-page="overview"><span class="side-icon">▦</span>Përmbledhje</button><button class="side-link" data-page="vehicles"><span class="side-icon">▣</span>Veturat</button><button class="side-link" data-page="reservations"><span class="side-icon">▤</span>Rezervimet</button><button class="side-link" data-page="customers"><span class="side-icon">♙</span>Klientët</button><p class="side-label" style="margin-top:25px">UEBFAQJA</p><button class="side-link" data-page="settings"><span class="side-icon">⚙</span>Përmbajtja dhe cilësimet</button><div class="sidebar-bottom"><a class="side-link" href="/" target="_blank"><span class="side-icon">↗</span>Shihni uebfaqen</a><button id="logout" class="side-link"><span class="side-icon">⇥</span>Dilni nga llogaria</button></div></aside><main class="admin-main"><header class="admin-topbar"><div style="display:flex;align-items:center"><button class="mobile-sidebar-toggle" id="sidebar-toggle" aria-label="Hap menynë">☰</button><span class="topbar-title" id="topbar-title">Përmbledhje</span></div><div class="topbar-right"><span class="topbar-date" id="today"></span><span class="admin-avatar" id="avatar">A</span></div></header><div class="admin-content" id="page-content"><div class="empty-state">Duke u hapur paneli…</div></div></main></div><dialog id="vehicle-dialog" class="modal"><form id="vehicle-form" class="modal-card"><button type="button" class="modal-close" aria-label="Mbyll">×</button><p class="eyebrow">MENAXHIMI I FLOTËS</p><h2 id="vehicle-modal-title">Shtoni veturë</h2><p class="modal-subtitle">Të dhënat e veturës do të shfaqen në uebfaqen tuaj.</p><input name="id" type="hidden"><div class="form-grid"><label class="field">Modeli<input name="name" required maxlength="100" placeholder="Golf 7"></label><label class="field">Marka<input name="brand" required maxlength="70" placeholder="Volkswagen"></label><label class="field">Çmimi për ditë (€)<input name="price_per_day" type="number" required min="0" max="10000000"></label><label class="field">Viti i prodhimit<input name="year" type="number" required min="1950" max="2099"></label><label class="field">Kambio<select name="transmission" required><option value="Automatic">Automatike</option><option value="Manual">Manuale</option></select></label><label class="field">Karburanti<select name="fuel" required><option value="Petrol">Benzinë</option><option value="Diesel">Naftë</option><option value="Hybrid">Hibrid</option><option value="Electric">Elektrike</option><option value="LPG">Gaz LPG</option></select></label><label class="field">Numri i ulëseve<input name="passengers" type="number" required min="1" max="20" value="5"></label><label class="field">Kategoria<input name="category" required maxlength="50" placeholder="SUV, Ekonomike, Premium"></label><label class="field"><span>Disponueshmëria</span><select name="available"><option value="true">Në dispozicion</option><option value="false">E padisponueshme</option></select></label><label class="field"><span>Rekomando në faqen kryesore</span><select name="featured"><option value="false">Jo</option><option value="true">Po</option></select></label><label class="field field-full">Përshkrimi<textarea name="description" required maxlength="3000" rows="3" placeholder="Përshkruani veturën"></textarea></label><div class="field field-full"><span>Fotot e veturës <span style="font-weight:400;color:#9298a5">(JPEG, PNG ose WebP · deri në 8 MB secila)</span></span><div id="image-list" class="vehicle-image-list"></div><label class="upload-box">＋ Shtoni foto<input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div></div><p id="vehicle-error" class="form-message"></p><button class="button button-orange button-wide" type="submit">Ruani veturën <span>↗</span></button></form></dialog><dialog id="confirm-dialog" class="modal"><div class="modal-card confirm-box"><button type="button" class="modal-close" aria-label="Mbyll">×</button><span style="font-size:25px;color:#d77b50">!</span><h3 id="confirm-title">Jeni të sigurt?</h3><p id="confirm-text"></p><div class="confirm-actions"><button class="button button-secondary" type="button" id="confirm-cancel">Anulo</button><button class="button button-danger" type="button" id="confirm-yes">Vazhdoni</button></div></div></dialog><div id="toast" class="toast" role="status"></div></body></html>
